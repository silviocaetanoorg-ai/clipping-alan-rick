name: Coletar notícias e publicar

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para coletar na hora
  push:
    branches: [main]
    paths-ignore: ["public/noticias.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: clipping
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Coletar notícias
        shell: pwsh
        run: ./coletar.ps1

      - name: Salvar base de notícias no repositório
        run: |
          if ! git diff --quiet -- public/noticias.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/noticias.json
            git commit -m "Coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
